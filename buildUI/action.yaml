name: 'Build UI'
description: 'Builds the UI artifact for a SIS cloud app'
inputs:

  workdir:
    description: 'The directory to work from. Can be relative or absolute'
    default: '.'

  artifact:
    description: 'The name of the artifact'
    required: true

  app_name:
    description: 'The name of this app - used as the folder in the CDN bucket and the first part of the URL path'
    required: true

  node_auth_token:
    description: 'Used to install dependencies from our private repos'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout Source
      uses: actions/checkout@v6

    - name: Setup NodeJS 24
      uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://npm.pkg.github.com/
        scope: '@uw-it-sis'

    - name: Check for duplicate dependencies
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        # Packages known to cause problems when duplicated. Add/remove entries here.
        # Each entry is a regex fragment matched against the package name.
        PKG_PATTERNS=(
          "lib-js-common"
          "lib-react"
          "lib-lambda"
          "react-router-dom"
        )

        # Join the list into an alternation regex, e.g. "lib-react|lib-lambda|...".
        pattern=$(IFS='|'; echo "${PKG_PATTERNS[*]}")

        mapfile -t dupes < <(jq -r --arg pattern "$pattern" '
          .packages
          | to_entries
          | map(select(.key | startswith("node_modules/")))
          | map({name: (.key | sub(".*node_modules/"; ""))})
          | group_by(.name)
          | map(select(length > 1))
          | .[].[0].name
          # keep only the packages known to cause problems when duplicated
          | select(test($pattern))
        ' package-lock.json)

        pkgs=$(IFS=','; echo "${dupes[*]}")
        if [[ -n "${pkgs}" ]]; then
          echo >&2 "Error: found ${#dupes[*]} packages dangerously duplicated in the dependency tree: [$pkgs]. This is known to cause issues. Please update your package.json to ensure only one version of this package is present in node_modules."
          exit 1
        fi

    - name: Install NPM dependencies
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node_auth_token }}
        CI: "true"

    - name: Build
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        # Minify builds on all branches except development.
        if [[ "${{ github.ref_name }}" = "development" ]]; then
            npm run build-dev
        else
            npm run build
        fi

    - name: Create Archive
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        (tar --transform s/dist/${{ inputs.app_name }}/ -czf - ./dist > ${{ inputs.ARTIFACT }})

